services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-preppilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-preppilot_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/company_questions.sql:/docker-entrypoint-initdb.d/02-company-questions.sql
      - ./database/seed_coding.sql:/docker-entrypoint-initdb.d/03-seed-coding.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preppilot -d preppilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend ─────────────────────────────────────────────────
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://preppilot:preppilot_dev_pass@postgres:5432/preppilot_db
      REDIS_URL: redis://redis:6379
      AI_INTERVIEW_URL: http://ai-interview:8001
      AI_LEARNING_URL: http://ai-learning:8002
      AI_RESUME_URL: http://ai-resume:8003
      AI_COPILOT_URL: http://ai-copilot:8004
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./backend/logs:/app/logs
    restart: unless-stopped

  # ── AI Services ─────────────────────────────────────────────
  ai-interview:
    build:
      context: ./ai-services
      dockerfile: Dockerfile.base
    command: uvicorn interview.main:app --host 0.0.0.0 --port 8001
    env_file: ./ai-services/.env
    ports:
      - "8001:8001"
    restart: unless-stopped

  ai-learning:
    build:
      context: ./ai-services
      dockerfile: Dockerfile.base
    command: uvicorn learning.main:app --host 0.0.0.0 --port 8002
    env_file: ./ai-services/.env
    ports:
      - "8002:8002"
    restart: unless-stopped

  ai-resume:
    build:
      context: ./ai-services
      dockerfile: Dockerfile.base
    command: uvicorn resume.main:app --host 0.0.0.0 --port 8003
    env_file: ./ai-services/.env
    ports:
      - "8003:8003"
    restart: unless-stopped

  ai-copilot:
    build:
      context: ./ai-services
      dockerfile: Dockerfile.base
    command: uvicorn copilot.main:app --host 0.0.0.0 --port 8004
    env_file: ./ai-services/.env
    ports:
      - "8004:8004"
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:5000}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ── Nginx ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
