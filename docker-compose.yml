services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-preppilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-preppilot_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/company_questions.sql:/docker-entrypoint-initdb.d/02-company-questions.sql
      - ./database/seed_coding.sql:/docker-entrypoint-initdb.d/03-seed-coding.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preppilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Backend ─────────────────────────────────────────────────
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-preppilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-preppilot_db}
      REDIS_URL: redis://redis:6379
      AI_INTERVIEW_URL: http://ai-interview:8001
      AI_LEARNING_URL: http://ai-learning:8002
      AI_RESUME_URL: http://ai-resume:8003
      AI_COPILOT_URL: http://ai-copilot:8004
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./backend/logs:/app/logs
    restart: unless-stopped

  # ── AI Services ─────────────────────────────────────────────
  # Each service is the same image with a different module/port. The
  # GEMINI_API_KEY comes from ai-services/.env (or the shell environment).
  ai-interview:
    build:
      context: ./ai-services
      dockerfile: Dockerfile.base
    command: uvicorn interview.main:app --host 0.0.0.0 --port 8001
    env_file:
      - path: ./ai-services/.env
        required: false
    environment:
      PORT: 8001
    ports:
      - "8001:8001"
    restart: unless-stopped

  ai-learning:
    build:
      context: ./ai-services
      dockerfile: Dockerfile.base
    command: uvicorn learning.main:app --host 0.0.0.0 --port 8002
    env_file:
      - path: ./ai-services/.env
        required: false
    environment:
      PORT: 8002
    ports:
      - "8002:8002"
    restart: unless-stopped

  ai-resume:
    build:
      context: ./ai-services
      dockerfile: Dockerfile.base
    command: uvicorn resume.main:app --host 0.0.0.0 --port 8003
    env_file:
      - path: ./ai-services/.env
        required: false
    environment:
      PORT: 8003
    ports:
      - "8003:8003"
    restart: unless-stopped

  ai-copilot:
    build:
      context: ./ai-services
      dockerfile: Dockerfile.base
    command: uvicorn copilot.main:app --host 0.0.0.0 --port 8004
    env_file:
      - path: ./ai-services/.env
        required: false
    environment:
      PORT: 8004
    ports:
      - "8004:8004"
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────
  # NEXT_PUBLIC_* values are inlined at BUILD time — pass them as build args.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ── Nginx (optional reverse proxy) ───────────────────────────
  # Serves plain HTTP by default so `docker compose up` works from a clean
  # checkout. Enable the HTTPS server block in nginx/nginx.conf once you have
  # mounted certificates under ./nginx/certs.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
