services:
  # ── Backend ──────────────────────────────────────────────────
  - type: web
    name: preppilot-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Render injects the PORT automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: preppilot-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: preppilot-redis
          type: keyvalue
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Free Render web services cannot receive private-network
      # traffic, so use their public HTTPS URLs.
      - key: AI_INTERVIEW_URL
        value: https://preppilot-ai-interview.onrender.com

      - key: AI_LEARNING_URL
        value: https://preppilot-ai-learning.onrender.com

      - key: AI_RESUME_URL
        value: https://preppilot-ai-resume.onrender.com

      - key: AI_COPILOT_URL
        value: https://preppilot-ai-copilot.onrender.com

      # Public frontend URL used for CORS/origin configuration.
      - key: FRONTEND_URL
        value: https://preppilot-frontend.onrender.com


  # ── AI Interview ─────────────────────────────────────────────
  - type: web
    name: preppilot-ai-interview
    runtime: python
    plan: free
    rootDir: ai-services

    # g++ / default-jdk are required for the code judge sandbox.
    buildCommand: pip install -r requirements.txt && apt-get update && apt-get install -y --no-install-recommends g++ default-jdk

    startCommand: uvicorn interview.main:app --host 0.0.0.0 --port ${PORT:-8001}

    healthCheckPath: /health

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: MODEL_NAME
        value: gemini-2.5-flash-lite

      - key: EMBEDDING_MODEL
        value: gemini-embedding-001


  # ── AI Learning ──────────────────────────────────────────────
  - type: web
    name: preppilot-ai-learning
    runtime: python
    plan: free
    rootDir: ai-services

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn learning.main:app --host 0.0.0.0 --port ${PORT:-8002}

    healthCheckPath: /health

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: MODEL_NAME
        value: gemini-2.5-flash-lite

      - key: EMBEDDING_MODEL
        value: gemini-embedding-001


  # ── AI Resume ────────────────────────────────────────────────
  - type: web
    name: preppilot-ai-resume
    runtime: python
    plan: free
    rootDir: ai-services

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn resume.main:app --host 0.0.0.0 --port ${PORT:-8003}

    healthCheckPath: /health

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: MODEL_NAME
        value: gemini-2.5-flash-lite

      - key: EMBEDDING_MODEL
        value: gemini-embedding-001


  # ── AI Copilot ───────────────────────────────────────────────
  - type: web
    name: preppilot-ai-copilot
    runtime: python
    plan: free
    rootDir: ai-services

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn copilot.main:app --host 0.0.0.0 --port ${PORT:-8004}

    healthCheckPath: /health

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: MODEL_NAME
        value: gemini-2.5-flash-lite

      - key: EMBEDDING_MODEL
        value: gemini-embedding-001


  # ── Frontend ─────────────────────────────────────────────────
  - type: web
    name: preppilot-frontend
    runtime: node
    plan: free
    rootDir: frontend

    # Next.js standalone output does not include .next/static
    # or public/, so copy them into the standalone directory.
    buildCommand: npm ci --include=dev && npm run build && cp -r .next/static .next/standalone/.next/static && ([ -d public ] && cp -r public .next/standalone/public || true)

    startCommand: node .next/standalone/server.js

    healthCheckPath: /

    envVars:
      - key: NODE_ENV
        value: production

      # NEXT_PUBLIC_* variables are embedded into the frontend
      # during the build.
      - key: NEXT_PUBLIC_API_URL
        value: https://preppilot-backend.onrender.com/api

      - key: NEXT_PUBLIC_WS_URL
        value: https://preppilot-backend.onrender.com


# ── PostgreSQL ─────────────────────────────────────────────────
databases:
  - name: preppilot-db
    databaseName: preppilot_db
    user: preppilot
    plan: free