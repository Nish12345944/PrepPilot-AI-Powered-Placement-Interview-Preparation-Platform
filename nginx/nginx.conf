events { worker_connections 1024; }

http {
  upstream backend  { server backend:5000; }
  upstream frontend { server frontend:3000; }

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  # ── HTTP server (default; works out of the box, no certs needed) ──
  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /api/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://backend/api/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /socket.io/ {
      proxy_pass http://backend/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── HTTPS (optional) ─────────────────────────────────────────
  # To enable: 1) place fullchain.pem + privkey.pem under ./nginx/certs
  #            2) uncomment the block below
  #            3) add "443:443" to the nginx ports in docker-compose.yml
  #            4) uncomment the redirect in the HTTP server above
  #
  # server {
  #   listen 443 ssl;
  #   server_name _;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #   ssl_session_cache   shared:SSL:10m;
  #
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   add_header X-Frame-Options DENY;
