name: PrepPilot CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: preppilot
          POSTGRES_PASSWORD: password
          POSTGRES_DB: preppilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests
        run: npm test -- --coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://preppilot:password@localhost:5432/preppilot_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret
          JWT_REFRESH_SECRET: test_refresh_secret
          NODE_ENV: test

  test-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (for code judge)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ default-jdk nodejs

      - name: Install Python deps
        run: pip install -r requirements.txt pytest httpx
        working-directory: ai-services

      - name: Run tests
        run: pytest tests/ -v
        working-directory: ai-services
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend
        continue-on-error: true  # lint warnings shouldn't hard-fail build

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_WS_URL: http://localhost:5000

  docker-build:
    needs: [test-backend, test-ai, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t preppilot-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t preppilot-frontend:${{ github.sha }} ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://yourdomain.com/api
          NEXT_PUBLIC_WS_URL: https://yourdomain.com

      - name: Build AI services image
        run: docker build -f ai-services/Dockerfile.base -t preppilot-ai:${{ github.sha }} ./ai-services

  build-and-push:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tags
        id: meta
        run: |
          echo "BACKEND_TAG=${{ secrets.DOCKER_USERNAME }}/preppilot-backend:latest" >> $GITHUB_ENV
          echo "FRONTEND_TAG=${{ secrets.DOCKER_USERNAME }}/preppilot-frontend:latest" >> $GITHUB_ENV
          echo "AI_INTERVIEW_TAG=${{ secrets.DOCKER_USERNAME }}/preppilot-ai-interview:latest" >> $GITHUB_ENV
          echo "AI_LEARNING_TAG=${{ secrets.DOCKER_USERNAME }}/preppilot-ai-learning:latest" >> $GITHUB_ENV
          echo "AI_RESUME_TAG=${{ secrets.DOCKER_USERNAME }}/preppilot-ai-resume:latest" >> $GITHUB_ENV
          echo "AI_COPILOT_TAG=${{ secrets.DOCKER_USERNAME }}/preppilot-ai-copilot:latest" >> $GITHUB_ENV

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_TAG }}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}

      # AI services — each built with same base but different CMD set at runtime
      - uses: docker/build-push-action@v5
        with:
          context: ./ai-services
          file: ./ai-services/Dockerfile.base
          push: true
          tags: ${{ env.AI_INTERVIEW_TAG }}

      - uses: docker/build-push-action@v5
        with:
          context: ./ai-services
          file: ./ai-services/Dockerfile.base
          push: true
          tags: ${{ env.AI_LEARNING_TAG }}

      - uses: docker/build-push-action@v5
        with:
          context: ./ai-services
          file: ./ai-services/Dockerfile.base
          push: true
          tags: ${{ env.AI_RESUME_TAG }}

      - uses: docker/build-push-action@v5
        with:
          context: ./ai-services
          file: ./ai-services/Dockerfile.base
          push: true
          tags: ${{ env.AI_COPILOT_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/preppilot
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f